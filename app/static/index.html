<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Echo 이전 시연 · 순번 쓰기</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #0f1419; --panel: #182029; --line: #2a3542; --text: #e8edf2; --muted: #8a97a6;
    --aws: #ff9900; --gcp: #4285f4; --onprem: #34a853; --other: #8a8f98;
    --ok: #3fb950; --fail: #f85149; --wait: #d29922; --slow: #ffd33d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic",
      "Noto Sans KR", "Segoe UI", sans-serif;
    font-size: 20px; line-height: 1.35;
  }
  main { max-width: 960px; margin: 0 auto; padding: 20px 24px 32px; }
  header { display: flex; justify-content: space-between; align-items: baseline; color: var(--muted); font-size: 18px; }
  header strong { color: var(--text); font-size: 22px; }
  .hero { display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: center;
    background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 18px 24px; margin-top: 12px; }
  .label { color: var(--muted); font-size: 18px; }
  #current-n { font-size: 148px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -2px; }
  .badge-box { text-align: right; }
  #env-badge { display: inline-block; padding: 14px 26px; border-radius: 14px; font-size: 44px; font-weight: 800;
    color: #111; background: var(--other); white-space: nowrap; }
  #env-badge.aws { background: var(--aws); }
  #env-badge.gcp { background: var(--gcp); color: #fff; }
  #env-badge.onprem { background: var(--onprem); color: #fff; }
  #env-host { margin-top: 8px; color: var(--muted); font-size: 16px; font-family: ui-monospace, Menlo, monospace; }
  .controls { display: flex; gap: 12px; align-items: center; margin-top: 14px; }
  button { font: inherit; font-size: 24px; font-weight: 700; padding: 12px 28px; border-radius: 12px; border: 0; cursor: pointer; }
  #start { background: var(--ok); color: #fff; }
  #stop { background: #3a4552; color: var(--text); }
  button:disabled { opacity: .4; cursor: default; }
  #run-state { color: var(--muted); font-size: 18px; }
  .banner { margin-top: 12px; padding: 12px 18px; border-radius: 12px; font-size: 24px; font-weight: 700; }
  #waiting { background: rgba(210,153,34,.15); color: var(--wait); border: 1px solid var(--wait); }
  #tail-loss { background: rgba(248,81,73,.15); color: var(--fail); border: 2px solid var(--fail); }
  .stats { display: grid; grid-template-columns: repeat(9, 1fr); gap: 8px; margin-top: 14px; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 10px;
    display: flex; flex-direction: column; justify-content: space-between; }
  .stat .label { font-size: 14px; }
  .stat .value { font-size: 28px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .stat.bad .value { color: var(--fail); }
  .stat.good .value { color: var(--ok); }
  .stat.slow .value { color: var(--slow); }
  #run-state .retrying { color: var(--slow); font-weight: 700; }
  h2 { font-size: 18px; color: var(--muted); font-weight: 600; margin: 18px 0 8px; display: flex; justify-content: space-between; }
  #strip { display: grid; grid-template-columns: repeat(60, 1fr); gap: 3px; height: 34px; }
  #strip span { border-radius: 3px; background: #222b35; }
  #strip span.aws { background: var(--aws); }
  #strip span.gcp { background: var(--gcp); }
  #strip span.onprem { background: var(--onprem); }
  #strip span.other { background: var(--other); }
  #strip span.fail { background: repeating-linear-gradient(45deg, var(--fail) 0 3px, #3a1416 3px 6px); }
  /* 지연(임계 이상 걸린 성공): 환경색 위에 노랑 줄무늬 + 노랑 테두리. 실패(빨강)와 구분된다. */
  #strip span.slow { background-image: repeating-linear-gradient(135deg, var(--slow) 0 3px, transparent 3px 7px);
    box-shadow: inset 0 0 0 2px var(--slow); }
  #strip-legend { display: flex; gap: 14px; align-items: center; font-size: 15px; }
  #strip-legend i { display: inline-block; width: 14px; height: 14px; border-radius: 3px; margin-right: 5px; vertical-align: -2px; }
  #strip-legend i.fast { background: var(--aws); }
  #strip-legend i.slow { background: var(--aws); background-image: repeating-linear-gradient(135deg, var(--slow) 0 3px, transparent 3px 7px);
    box-shadow: inset 0 0 0 2px var(--slow); }
  #strip-legend i.fail { background: repeating-linear-gradient(45deg, var(--fail) 0 3px, #3a1416 3px 6px); }
  table { width: 100%; border-collapse: collapse; font-size: 20px; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 600; font-size: 16px; }
  td.num, th.num { text-align: right; }
  .dot { display: inline-block; width: 14px; height: 14px; border-radius: 50%; margin-right: 8px; background: var(--other); vertical-align: -1px; }
  .dot.aws { background: var(--aws); } .dot.gcp { background: var(--gcp); } .dot.onprem { background: var(--onprem); }
  #ledger-state { font-size: 16px; }
  #ledger-state.err { color: var(--fail); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <header>
    <strong>Echo 이전 시연 · 순번 쓰기</strong>
    <span id="version"></span>
  </header>

  <section class="hero">
    <div>
      <div class="label">지금 순번</div>
      <div id="current-n">—</div>
    </div>
    <div class="badge-box">
      <div class="label">응답 환경</div>
      <div id="env-badge">확인 중</div>
      <div id="env-host"></div>
    </div>
  </section>

  <div class="controls">
    <button id="start" type="button">쓰기 시작</button>
    <button id="stop" type="button" disabled>멈춤</button>
    <span id="run-state"></span>
  </div>

  <div id="waiting" class="banner" hidden></div>
  <div id="tail-loss" class="banner" hidden></div>

  <section class="stats">
    <div class="stat"><div class="label">보낸 수</div><div class="value" id="s-sent">0</div></div>
    <div class="stat good"><div class="label">성공</div><div class="value" id="s-ok">0</div></div>
    <div class="stat" id="s-fail-box"><div class="label">실패</div><div class="value" id="s-fail">0</div></div>
    <div class="stat" id="s-slow-box"><div class="label">지연된 요청</div><div class="value" id="s-slow">0</div></div>
    <div class="stat" id="s-max-box"><div class="label">최대 지연(초)</div><div class="value" id="s-max">—</div></div>
    <div class="stat"><div class="label">마지막 확인 번호</div><div class="value" id="s-confirmed">—</div></div>
    <div class="stat"><div class="label">장부 최대 번호</div><div class="value" id="s-ledger-max">—</div></div>
    <div class="stat" id="s-missing-box"><div class="label">누락</div><div class="value" id="s-missing">—</div></div>
    <div class="stat" id="s-dup-box"><div class="label">중복</div><div class="value" id="s-dup">—</div></div>
  </section>

  <h2><span>최근 60건 응답 환경 (왼쪽이 오래된 것)</span><span id="strip-legend"><span><i class="fast"></i>성공(환경색)</span><span><i class="slow"></i>지연 <b id="slow-threshold">3</b>초 이상·재시도 끝 성공</span><span><i class="fail"></i>실패</span></span></h2>
  <div id="strip"></div>

  <h2><span>환경별 장부 건수</span><span id="ledger-state"></span></h2>
  <table>
    <thead><tr><th>환경</th><th class="num">건수</th><th class="num">번호 범위</th></tr></thead>
    <tbody id="by-env"><tr><td colspan="3">—</td></tr></tbody>
  </table>
</main>

<script>
"use strict";
(() => {
  const STRIP_SIZE = 60;
  // 무중단(#23): 전환 최대 31.4초·복귀 최대 23.4초(실측)보다 널널하게 기다린다.
  const WRITE_TIMEOUT_MS = 60000;   // 요청 하나 제한
  const SUMMARY_TIMEOUT_MS = 30000; // 조회(장부·환경) 제한
  const RETRY_WINDOW_MS = 60000;    // 같은 Idempotency-Key 로 다시 보내는 기간(첫 전송부터)
  const RETRY_EVERY_MS = 1000;      // 재시도 간격
  const RETRY_STATUSES = new Set([502, 503, 504]);
  const SUMMARY_EVERY_MS = 1000;
  const INFO_EVERY_MS = 2000;
  const WAIT_SHOW_AFTER_MS = 1000;
  const KNOWN_NAMES = { "aws-tokyo": "AWS 도쿄", "gcp-seoul": "GCP 서울" };

  const params = new URLSearchParams(location.search);
  const parsed = Number.parseInt(params.get("interval") ?? "", 10);
  const intervalMs = Number.isFinite(parsed) ? Math.min(5000, Math.max(50, parsed)) : 1000;
  // 이 시간(ms) 이상 걸린 성공은 「지연」으로 칠하고 센다. ?slow=3000 으로 조절.
  const parsedSlow = Number.parseInt(params.get("slow") ?? "", 10);
  const slowMs = Number.isFinite(parsedSlow) ? Math.min(60000, Math.max(100, parsedSlow)) : 3000;

  // 멱등 키. crypto.randomUUID 는 https·localhost 에서만 있어서 getRandomValues 로 v4 를 만든다.
  function newIdempotencyKey() {
    if (typeof crypto.randomUUID === "function") return crypto.randomUUID();
    const b = crypto.getRandomValues(new Uint8Array(16));
    b[6] = (b[6] & 0x0f) | 0x40;
    b[8] = (b[8] & 0x3f) | 0x80;
    const h = Array.from(b, (x) => x.toString(16).padStart(2, "0")).join("");
    return `${h.slice(0, 8)}-${h.slice(8, 12)}-${h.slice(12, 16)}-${h.slice(16, 20)}-${h.slice(20)}`;
  }

  const $ = (id) => document.getElementById(id);
  const fmt = (v) => (v === null || v === undefined ? "—" : Number(v).toLocaleString("ko-KR"));

  function envClass(env) {
    if (!env) return "other";
    if (env === "aws" || env.startsWith("aws-")) return "aws";
    if (env === "gcp" || env.startsWith("gcp-")) return "gcp";
    if (env.startsWith("onprem")) return "onprem";
    return "other";
  }
  function envName(env) {
    if (!env) return "알 수 없음";
    if (KNOWN_NAMES[env]) return KNOWN_NAMES[env];
    if (env.startsWith("onprem")) return "온프레";
    return env;
  }

  const state = {
    running: false, loopActive: false, inflightSince: null,
    sent: 0, ok: 0, fail: 0,   // fail = 재시도를 다 쓰고도 실패한 요청만
    slow: 0, maxLatencyMs: 0, // slow = 임계 이상 걸린 성공(재시도 끝 성공 포함)
    retrying: 0,              // 지금 요청의 재시도 횟수(같은 키)
    current: null,          // 가장 최근 201 응답
    confirmedMax: 0,        // 201 로 확인 받은 가장 큰 번호
    ledger: null,           // 마지막 summary
    ledgerBaseline: 0,      // 그 summary 를 요청할 때까지 확인 받은 가장 큰 번호
    ledgerError: false,
    strip: [],
  };

  async function fetchJson(url, options, timeoutMs) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), timeoutMs);
    try {
      const res = await fetch(url, { cache: "no-store", ...options, signal: ctrl.signal });
      const body = await res.json().catch(() => null);
      return { status: res.status, body };
    } finally {
      clearTimeout(timer);
    }
  }

  function setBadge(env, host) {
    const badge = $("env-badge");
    badge.className = envClass(env);
    badge.textContent = envName(env);
    badge.title = env || "";
    $("env-host").textContent = host ? `${host}` : "";
  }

  // 띠 한 칸: { env, slow, ms }. env 가 null 이면 실패(재시도 소진).
  function pushStrip(env, slow, ms) {
    state.strip.push({ env, slow, ms });
    if (state.strip.length > STRIP_SIZE) state.strip.shift();
  }

  const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

  // 쓰기 하나. 네트워크 오류·502/503/504·시간 초과면 같은 Idempotency-Key 로
  // 1초 간격으로 다시 보낸다(첫 전송부터 60초까지). 서버가 같은 키를 알아보므로 중복 행이 없다.
  // 응답 시간은 첫 전송부터 마지막 응답까지(재시도 포함)로 잰다.
  async function writeOnce() {
    state.sent += 1;
    const key = newIdempotencyKey();
    const started = performance.now();
    state.inflightSince = started;
    state.retrying = 0;
    render();
    let body = null;
    try {
      for (;;) {
        let retryable;
        try {
          const res = await fetchJson(
            "/api/writes",
            { method: "POST", headers: { "Idempotency-Key": key } },
            WRITE_TIMEOUT_MS,
          );
          // 201 = 새로 씀, 200 = 같은 키로 이미 쓴 요청(앞 시도가 커밋된 뒤 응답만 잃은 경우).
          if ((res.status === 201 || res.status === 200) && res.body && Number.isInteger(res.body.n)) {
            body = res.body;
            break;
          }
          retryable = RETRY_STATUSES.has(res.status);
        } catch (_err) {
          retryable = true;  // 시간 초과(60초)·연결 실패
        }
        // [멈춤]을 눌러도 지금 요청은 끝까지 재시도한다(꼬리 손실 판정을 흐리지 않게).
        if (!retryable) break;
        if (performance.now() - started + RETRY_EVERY_MS > RETRY_WINDOW_MS) break;
        state.retrying += 1;
        render();
        await sleep(RETRY_EVERY_MS);
      }
    } finally {
      const ms = performance.now() - started;
      if (body) {
        const slow = ms >= slowMs || state.retrying > 0;
        state.ok += 1;
        if (slow) state.slow += 1;
        state.maxLatencyMs = Math.max(state.maxLatencyMs, ms);
        state.current = body;
        state.confirmedMax = Math.max(state.confirmedMax, body.n);
        setBadge(body.environment, body.hostname);
        pushStrip(body.environment, slow, ms);
      } else {
        state.fail += 1;  // 재시도를 다 쓰고도 실패(또는 400 같은 재시도 안 하는 응답)
        pushStrip(null, false, ms);
      }
      state.retrying = 0;
      state.inflightSince = null;
      render();
    }
  }

  // 쓰기는 직렬이다: 응답을 받은 뒤 간격만큼 쉬고 다음 요청을 보낸다.
  async function writeLoop() {
    if (state.loopActive) return;
    state.loopActive = true;
    try {
      while (state.running) {
        await writeOnce();
        if (!state.running) break;
        await new Promise((resolve) => setTimeout(resolve, intervalMs));
      }
    } finally {
      state.loopActive = false;
      render();
    }
  }

  async function pollSummary() {
    const baseline = state.confirmedMax;
    try {
      const { status, body } = await fetchJson("/api/writes/summary", {}, SUMMARY_TIMEOUT_MS);
      if (status === 200 && body) {
        state.ledger = body;
        state.ledgerBaseline = baseline;
        state.ledgerError = false;
      } else {
        state.ledgerError = true;
      }
    } catch (_err) {
      state.ledgerError = true;
    } finally {
      render();
      setTimeout(pollSummary, SUMMARY_EVERY_MS);
    }
  }

  // 쓰지 않을 때도 지금 어느 환경이 답하는지 보이게 한다.
  async function pollInfo() {
    try {
      if (!state.running) {
        const { status, body } = await fetchJson("/api/info", {}, SUMMARY_TIMEOUT_MS);
        if (status === 200 && body) {
          setBadge(body.environment, body.hostname);
          if (body.version) $("version").textContent = `버전 ${body.version}`;
        }
      }
    } catch (_err) {
      // 다음 주기에 다시 읽는다.
    } finally {
      setTimeout(pollInfo, INFO_EVERY_MS);
    }
  }

  function renderWaiting() {
    const box = $("waiting");
    const since = state.inflightSince;
    const waited = since === null ? 0 : performance.now() - since;
    if (waited > WAIT_SHOW_AFTER_MS) {
      box.textContent = `응답 대기 중 ${(waited / 1000).toFixed(1)}초`;
      box.hidden = false;
    } else {
      box.hidden = true;
    }
  }

  function render() {
    $("current-n").textContent = state.current ? fmt(state.current.n) : "—";
    $("s-sent").textContent = fmt(state.sent);
    $("s-ok").textContent = fmt(state.ok);
    $("s-fail").textContent = fmt(state.fail);
    $("s-fail-box").classList.toggle("bad", state.fail > 0);
    $("s-slow").textContent = fmt(state.slow);
    $("s-slow-box").classList.toggle("slow", state.slow > 0);
    $("s-max").textContent = state.ok > 0 ? (state.maxLatencyMs / 1000).toFixed(1) : "—";
    $("s-max-box").classList.toggle("slow", state.maxLatencyMs >= slowMs);
    $("s-confirmed").textContent = state.confirmedMax > 0 ? fmt(state.confirmedMax) : "—";

    $("start").disabled = state.running;
    $("stop").disabled = !state.running;
    const runState = $("run-state");
    runState.textContent = state.running
      ? `쓰는 중 · 요청 간격 ${intervalMs}ms`
      : state.loopActive ? "멈추는 중 (마지막 응답 대기)" : `멈춤 · 요청 간격 ${intervalMs}ms`;
    if (state.retrying > 0) {
      const retry = document.createElement("span");
      retry.className = "retrying";
      retry.textContent = ` · 재시도 중 ${state.retrying}`;
      runState.append(retry);
    }

    const ledger = state.ledger;
    $("s-ledger-max").textContent = ledger ? fmt(ledger.maxN) : "—";
    $("s-missing").textContent = ledger ? fmt(ledger.missing) : "—";
    $("s-dup").textContent = ledger ? fmt(ledger.duplicates) : "—";
    $("s-missing-box").classList.toggle("bad", !!ledger && ledger.missing > 0);
    $("s-missing-box").classList.toggle("good", !!ledger && ledger.missing === 0);
    $("s-dup-box").classList.toggle("bad", !!ledger && ledger.duplicates > 0);
    $("s-dup-box").classList.toggle("good", !!ledger && ledger.duplicates === 0);

    const ledgerState = $("ledger-state");
    ledgerState.classList.toggle("err", state.ledgerError);
    ledgerState.textContent = state.ledgerError
      ? "장부 읽기 실패 (다시 시도 중)"
      : ledger ? `장부 응답: ${envName(ledger.environment)} · 1초마다 갱신` : "";

    // 확인 받은 번호가 장부에 없으면 꼬리 손실을 의심한다.
    const tail = $("tail-loss");
    const ledgerMax = ledger ? (ledger.maxN ?? 0) : null;
    if (ledgerMax !== null && ledgerMax < state.ledgerBaseline) {
      tail.textContent = `꼬리 손실 의심: 확인 받은 번호 ${fmt(state.ledgerBaseline)}번이 장부에 없음 (장부 최대 ${fmt(ledgerMax)})`;
      tail.hidden = false;
    } else {
      tail.hidden = true;
    }

    const strip = $("strip");
    strip.replaceChildren(...Array.from({ length: STRIP_SIZE }, (_, i) => {
      const cell = document.createElement("span");
      const offset = STRIP_SIZE - state.strip.length;
      if (i >= offset) {
        const { env, slow, ms } = state.strip[i - offset];
        const secs = `${(ms / 1000).toFixed(1)}초`;
        cell.className = env === null ? "fail" : `${envClass(env)}${slow ? " slow" : ""}`;
        cell.title = env === null ? `실패 · ${secs}` : `${envName(env)} · ${secs}${slow ? " · 지연" : ""}`;
      }
      return cell;
    }));

    const tbody = $("by-env");
    const rows = ledger && ledger.byEnvironment.length ? ledger.byEnvironment : null;
    tbody.replaceChildren(...(rows ? rows.map((e) => {
      const tr = document.createElement("tr");
      const name = document.createElement("td");
      const dot = document.createElement("span");
      dot.className = `dot ${envClass(e.environment)}`;
      name.append(dot, document.createTextNode(envName(e.environment)));
      const count = document.createElement("td");
      count.className = "num";
      count.textContent = fmt(e.count);
      const range = document.createElement("td");
      range.className = "num";
      range.textContent = `${fmt(e.minN)} ~ ${fmt(e.maxN)}`;
      tr.append(name, count, range);
      return tr;
    }) : [(() => {
      const tr = document.createElement("tr");
      const td = document.createElement("td");
      td.colSpan = 3;
      td.textContent = ledger ? "아직 쓴 번호가 없음" : "—";
      tr.append(td);
      return tr;
    })()]));
  }

  $("start").addEventListener("click", () => {
    state.running = true;
    render();
    writeLoop();
  });
  $("stop").addEventListener("click", () => {
    state.running = false;
    render();
  });

  $("slow-threshold").textContent = String(Number((slowMs / 1000).toFixed(1)));
  setInterval(renderWaiting, 100);
  render();
  pollInfo();
  pollSummary();
})();
</script>
</body>
</html>
