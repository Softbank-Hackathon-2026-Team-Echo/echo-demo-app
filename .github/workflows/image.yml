# main 이 바뀔 때 공개 이미지(amd64 + arm64)를 GHCR 에 게시한다.
# 용도: 클라우드 자격 증명 없이 어느 기기에서든 같은 digest 를 받게 한다(온프레 k3s 설치, echo-infra onprem/).
# Echo 플랫폼의 원터치 배포는 여전히 자기 빌드 실행기로 이 저장소를 빌드한다. 이 이미지는 그것을 대신하지 않는다.
name: image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/softbank-hackathon-2026-team-echo/echo-demo-app

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:main
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Digest
        run: |
          echo "### 이미지" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${IMAGE}@${{ steps.build.outputs.digest }}\` (커밋 \`${GITHUB_SHA}\`)" >> "$GITHUB_STEP_SUMMARY"
